<form [formGroup]="signUpForm" (ngSubmit)="addOrUpdateUser()" class="flex w-full flex-col gap-4">
  <div class="flex gap-4">
    <div class="flex basis-1/3 items-center">
      <div class="relative w-full">
        <img
          [ngSrc]="imagePreview() ?? 'images/profile-user-3.png'"
          priority
          height="32"
          width="32"
          alt="Immagine utente"
          class="aspect-square max-h-32 w-full max-w-32 rounded-full border-2 border-card-border object-cover" />

        @if (this.imagePreview()) {
          <label
            for="imageUpload"
            class="absolute -right-2 bottom-8 flex h-6 w-6 cursor-pointer items-center justify-center rounded-full border-2 border-card-border bg-surface text-xs text-on-surface hover:bg-neutral-500">
            <button type="button" (click)="onImageRemove()"><fa-icon [icon]="ICON_TRASH"></fa-icon></button>
          </label>
        }

        <label
          for="imageUpload"
          class="absolute -bottom-1 right-1 flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border-2 border-card-border bg-surface text-on-surface hover:bg-neutral-500">
          <fa-icon [icon]="ICON_PEN"></fa-icon>
          <input
            id="imageUpload"
            class="hidden"
            type="file"
            accept="image/jpg, image/jpeg, image/png"
            (change)="onImageChange($event)" />
        </label>
      </div>
    </div>

    <div class="flex basis-2/3 flex-col gap-4">
      <fv-field name="name" label="Nome"></fv-field>
      <fv-field name="lastName" label="Cognome"></fv-field>
    </div>
  </div>

  <fv-field name="userName" label="Username"></fv-field>

  <fv-field name="birthDate" label="Data di nascita" type="date"></fv-field>

  <fv-field name="email" label="Email" type="email"></fv-field>

  <fv-field name="password" label="Password" type="password"></fv-field>

  @if (!user()) {
    <div class="mt-4 flex items-center text-sm text-on-background">
      <input
        type="checkbox"
        id="privacy"
        class="mr-2 h-4 w-4 rounded border-gray-300 text-primary-500 focus:ring-primary-500"
        (change)="onUpdatePolicyAcceptance($event)" />
      <label for="privacy" class="text-gray-200">
        Accetto la
        <a href="./sign-up/privacy-policy" class="font-bold text-primary-500 hover:underline">Privacy Policy</a>
      </label>
    </div>
  }

  <fv-button
    class="mt-8"
    type="submit"
    [label]="firebaseService.userFirebase() ? 'Aggiorna' : 'Registrati'"
    [disabled]="signUpForm.invalid"></fv-button>
</form>
