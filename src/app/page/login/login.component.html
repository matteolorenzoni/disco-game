<section class="relative flex min-h-screen flex-col overflow-hidden bg-neutral-800 p-4 text-on-surface">
  <div class="mb-20 mt-auto">
    <div class="flex flex-col gap-4">
      <button
        type="button"
        class="inline-block w-full rounded-full bg-primary-500 px-6 pb-2 pt-2.5 text-xs font-medium uppercase leading-normal transition"
        (click)="setPage($event, 'login')">
        Entra
      </button>

      <button
        type="button"
        class="inline-block w-full rounded-full bg-secondary-500 px-6 pb-2 pt-2.5 text-xs font-medium uppercase leading-normal"
        (click)="router.navigate(['/sign-up'])">
        Registrati
      </button>
    </div>
  </div>

  <div
    id="container_form"
    [@loginFormAnimation]="page() === 'login' ? 'center' : 'bottom'"
    class="absolute -bottom-full left-0 flex w-full flex-col justify-center gap-8 rounded-t-3xl bg-background p-4 pb-20 text-on-background">
    <div class="flex flex-col gap-1 text-center text-on-background">
      <h3 class="text-3xl font-semibold text-white">Ben tornato!</h3>
      <p class="text-sm">Accedi al tuo account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="flex w-full max-w-2xl flex-col justify-between gap-2">
      <fv-field-icon name="email" label="Email" [icon]="faUser" type="email"></fv-field-icon>

      <fv-field-icon name="password" label="Password" [icon]="faLock" type="password"></fv-field-icon>

      <div class="flex justify-between px-1">
        <div class="inline-flex items-center">
          <label class="relative flex cursor-pointer items-center" for="check">
            <input
              id="check"
              type="checkbox"
              [checked]="rememberMe()"
              (change)="onRememberMeChange($event.target)"
              class="peer h-5 w-5 cursor-pointer appearance-none rounded shadow transition-all checked:bg-primary-500" />
            <span
              class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 transform text-white opacity-0 peer-checked:opacity-100">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-3.5 w-3.5"
                viewBox="0 0 20 20"
                fill="currentColor"
                stroke="currentColor"
                stroke-width="1">
                <path
                  fill-rule="evenodd"
                  d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                  clip-rule="evenodd"></path>
              </svg>
            </span>
          </label>
          <label class="ml-2 cursor-pointer text-sm" for="check-2"> Ricordami </label>
        </div>

        <a href="./restore-password" class="text-sm font-bold hover:underline">Password dimentica?</a>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="mt-8 inline-block w-full rounded bg-primary-500 px-6 pb-2 pt-2.5 text-xs font-medium uppercase leading-normal text-white disabled:cursor-not-allowed disabled:bg-neutral-700 disabled:text-neutral-800">
        Login
      </button>
    </form>

    <p class="text-center text-sm">
      Non hai un account?
      <a href="./sign-up" class="font-bold text-primary-500 hover:underline">Registrati</a>
    </p>
  </div>
</section>
