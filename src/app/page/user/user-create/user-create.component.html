<form [formGroup]="signUpForm" (ngSubmit)="addOrUpdateUser()" class="flex w-full flex-col gap-4">
  <div class="flex items-center gap-4">
    <div class="flex w-1/3 flex-col items-center gap-2">
      <div class="relative">
        <img
          [src]="imagePreview() ?? '/images/profile-user.png'"
          alt="Anteprima immagine"
          class="aspect-square max-h-32 w-full max-w-32 rounded-full border-2 border-card-border object-cover object-center shadow" />

        <label
          for="imageUpload"
          class="absolute bottom-2 right-2 flex h-8 w-8 cursor-pointer flex-col items-center justify-center rounded-full border-2 border-card-border bg-surface text-on-surface">
          <fa-icon [icon]="ICON_PEN"></fa-icon>
          <input
            id="imageUpload"
            class="hidden"
            type="file"
            accept="image/jpg, image/jpeg, image/png"
            (change)="storageService.onImageChange($event, imagePreview, imageFile)" />
        </label>
      </div>
    </div>

    <div class="flex w-2/3 flex-col gap-4">
      <fv-field name="name" label="Nome"></fv-field>
      <fv-field name="lastName" label="Cognome"></fv-field>
    </div>
  </div>

  <fv-field name="userName" label="Username"></fv-field>

  <fv-field name="email" label="Email" type="email"></fv-field>

  <fv-field name="password" label="Password" type="password"></fv-field>

  <fv-button
    class="mt-12"
    type="submit"
    [label]="userService.user() ? 'Aggiorna' : 'Registrati'"
    [disabled]="signUpForm.invalid"></fv-button>
</form>
