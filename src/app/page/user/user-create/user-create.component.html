<form [formGroup]="signUpForm" (ngSubmit)="addOrUpdateUser()" class="flex w-full flex-col gap-4 text-on-background">
  <div class="flex items-center gap-4">
    <div class="flex w-1/3 flex-col items-center gap-2">
      <div class="relative">
        <img
          [src]="imagePreview() ?? '/images/profile-user.png'"
          alt="Anteprima immagine"
          class="aspect-square max-h-32 w-full max-w-32 rounded-full border-2 border-card-border object-cover object-center shadow" />

        <label
          for="imageUpload"
          class="absolute bottom-2 right-2 flex h-8 w-8 cursor-pointer flex-col items-center justify-center rounded-full border-2 border-card-border bg-surface text-on-surface">
          <fa-icon [icon]="ICON_PEN"></fa-icon>
          <input
            id="imageUpload"
            class="hidden"
            type="file"
            accept="image/jpg, image/jpeg, image/png"
            (change)="storageService.onImageChange($event, imagePreview, imageFile)" />
        </label>
      </div>
    </div>

    <div class="flex w-2/3 flex-col gap-4">
      <div class="flex w-full flex-col gap-1">
        <label for="name" class="block text-sm font-medium text-field-label-color"> Nome </label>
        <input
          id="signup_name"
          formControlName="name"
          type="text"
          class="w-full rounded border border-field-border bg-field-background px-3 py-2 text-sm text-field-color shadow-sm focus:border-2 focus:border-primary-500 focus:outline-none" />
      </div>

      <div class="flex w-full flex-col gap-1">
        <label for="lastName" class="block text-sm font-medium text-field-label-color"> Cognome </label>
        <input
          id="lastName"
          formControlName="lastName"
          type="text"
          class="w-full rounded border border-field-border bg-field-background px-3 py-2 text-sm text-field-color shadow-sm focus:border-2 focus:border-primary-500 focus:outline-none" />
      </div>
    </div>
  </div>

  <div class="flex w-full flex-col gap-1">
    <label for="userName" class="block text-sm font-medium text-field-label-color"> Username </label>
    <input
      id="userName"
      formControlName="userName"
      type="text"
      class="w-full rounded border border-field-border bg-field-background px-3 py-2 text-sm text-field-color shadow-sm focus:border-2 focus:border-primary-500 focus:outline-none" />
  </div>

  <div class="flex w-full flex-col gap-1">
    <label for="email" class="block text-sm font-medium text-field-label-color"> Email </label>
    <input
      id="email"
      formControlName="email"
      type="email"
      class="w-full rounded border border-field-border bg-field-background px-3 py-2 text-sm text-field-color shadow-sm focus:border-2 focus:border-primary-500 focus:outline-none disabled:cursor-not-allowed disabled:bg-neutral-700 disabled:text-neutral-600" />
  </div>

  <div class="flex w-full flex-col gap-1">
    <label for="password" class="text-primary block text-sm font-medium"> Password </label>
    <input
      id="password"
      formControlName="password"
      type="password"
      class="w-full rounded border border-field-border bg-field-background px-3 py-2 text-sm text-field-color shadow-sm focus:border-2 focus:border-primary-500 focus:outline-none disabled:cursor-not-allowed disabled:bg-neutral-700 disabled:text-neutral-600" />
  </div>

  <button
    type="submit"
    [disabled]="signUpForm.invalid"
    class="mt-8 rounded bg-primary-500 p-2 text-xs uppercase text-on-background disabled:cursor-not-allowed disabled:bg-primary-200 disabled:text-primary-300">
    {{ userService.user() ? 'Aggiorna' : 'Registrati' }}
  </button>
</form>
