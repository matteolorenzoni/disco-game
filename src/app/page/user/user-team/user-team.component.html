<app-title
  [pages]="[
    { path: '../../../../events', label: 'Eventi' },
    { path: '../../' + teamId(), label: 'Squadra' },
    { path: '', label: 'Compagno' }
  ]">
</app-title>

<div class="mb-8 flex flex-col gap-1 text-center text-on-background">
  <h3 class="text-3xl font-semibold text-white">{{ user()?.props?.name }} {{ user()?.props?.lastName }}</h3>
  <p class="text-sm">{{ user()?.props?.userName }}</p>
</div>

<ul class="grid grid-cols-[repeat(auto-fill,minmax(6rem,1fr))] gap-4">
  @for (eventChallenge of eventChallenges(); track eventChallenge.id) {
    <li class="shadwo flex flex-col items-center gap-2 rounded bg-surface p-2 text-on-surface">
      <img
        class="h-20 w-20"
        [src]="'images/challenge/' + eventChallenge.props.challengeType + '.png'"
        [alt]="'Immagine ' + eventChallenge.props.challengeName" />
      <div class="flex grow flex-col items-center justify-evenly gap-1">
        <p class="text-center text-xs">{{ eventChallenge.props.challengeName }}</p>
        <p class="text-center text-xs">85</p>
      </div>
    </li>
  }
</ul>
