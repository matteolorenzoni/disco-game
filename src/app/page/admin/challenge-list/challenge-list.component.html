<app-title [pages]="[{ path: '', label: 'Sfide' }]"> </app-title>

<ul class="grid grid-cols-[repeat(auto-fit,minmax(20rem,1fr))] gap-4 text-on-surface">
  @for (challenge of challenges(); track challenge.id) {
    <li
      class="cursor-pointer rounded-md border-2 border-secondary-400 bg-surface p-4 text-on-surface shadow hover:bg-secondary-400">
      <button class="flex w-full flex-col gap-2" (click)="goToUpdateChallenge(challenge.id)">
        <div class="flex w-full gap-4">
          <img class="h-16 w-16" [src]="'images/challenge/' + challenge.props.type + '.png'" alt="" />
          <div class="flex w-full flex-col overflow-hidden text-start">
            <p class="mb-auto truncate text-lg font-bold text-primary-800">{{ challenge.props.name }}</p>
            <p class="text-xs text-primary-600">Punteggio: {{ challenge.props.points }}</p>
            <div class="flex gap-2">
              <span class="text-xs text-primary-600">Difficoltà: </span>
              <fv-rating [rating]="challenge.props.complexity"></fv-rating>
            </div>
          </div>
        </div>
        <div class="text-start">
          <h6 class="text-sm font-semibold text-primary-800">Descrizione</h6>
          <p class="line-clamp-3 whitespace-pre-line text-xs italic text-primary-500">
            {{ challenge.props.description }}
          </p>
        </div>
        <div class="text-start">
          <h6 class="text-sm font-semibold text-primary-800">Regole</h6>
          <p class="line-clamp-3 whitespace-pre-line text-xs italic text-primary-500">
            {{ challenge.props.rules }}
          </p>
        </div>
      </button>
    </li>
  }
</ul>

<fv-floating-button [execute]="executeFloatingButton.bind(this)"></fv-floating-button>
